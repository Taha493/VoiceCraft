[project]
name = "voicecraft"
version = "0.1.0"
description = "Local AI voice-over generator for silent, captioned videos"
authors = [
    { name = "Taha Mahmood", email = "taha.tsf901@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "psutil>=5.9",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    "rapidocr>=2.0",
    "kokoro-onnx>=0.4",
    # misaki is the G2P Kokoro was trained with. Its [en] extra is listed by hand to leave out
    # spacy-curated-transformers, which drags PyTorch into memory (+340 MB) via spaCy's plugin
    # registry. The spaCy model is pinned so nothing is pip-installed at runtime.
    "misaki>=0.9.4",
    "spacy>=3.7",
    "num2words>=0.5",
    "espeakng-loader>=0.2",
    "phonemizer-fork>=3.3",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Reference Kokoro implementation (PyTorch, CPU wheels). Heavier; used for benchmarking.
torch = ["kokoro>=0.9", "torch>=2.3"]
# Piper is GPL-3.0 (piper1-gpl); kept optional. Individual voices carry their own licenses.
piper = ["piper-tts>=1.3"]
tesseract = ["pytesseract>=0.3"]

[project.scripts]
voicecraft = "voicecraft.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
